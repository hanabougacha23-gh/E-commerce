# SERVER CONFIGURATION
server.port=8081
server.address=0.0.0.0
spring.application.name=ecommerce-backend

# GZIP Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Root1234@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA/HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET:9a45642b10283c47c191a6d7f9d869240683a93a0b12c3d4e5f6a7b8c9d0e1f2}
jwt.expiration=86400000

# STRIPE
stripe.api.key=${STRIPE_API_KEY:votre_cle_test_ici}

# LOGGING
logging.level.org.springframework.security=INFO
logging.level.com.example.backend=INFO
